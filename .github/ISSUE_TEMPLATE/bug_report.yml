name: Bug report
description: Reporta un error en BPT Converter
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Gracias por reportar un problema. Incluye detalles para poder reproducirlo.
  - type: textarea
    id: description
    attributes:
      label: Descripción del problema
      description: Qué pasó y qué esperabas que pasara.
      placeholder: Describe el bug claramente...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: Lista pasos concretos.
      placeholder: |
        1. Abrir...
        2. Seleccionar...
        3. Hacer clic en...
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Sistema operativo
      options:
        - Windows 10
        - Windows 11
        - macOS Intel
        - macOS Apple Silicon
        - Otro
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de BPT Converter
      placeholder: "1.2"
  - type: textarea
    id: logs
    attributes:
      label: Logs / mensajes de error
      description: Pega el error o adjunta el contenido relevante de `errores.log`.
      render: text
